name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Recitation-Coach-APK
          path: app/build/outputs/apk/debug/app-debug.apk
Important: This assumes your ZIP contains a standard Android/Gradle project with a gradlew file.
After pasting it: Commit changes → Actions → select “Build Android APK” → Run workflow.
If you show me a screenshot of your Blank.yml before committing, I can check it for you.
